name: Run tests
on:
  pull_request:

  push:
    branches: [main]
    paths:
      - android/**
      - package.json
      - src/**
      - tests/**
      - .github/workflows/test.yml

  workflow_call:

  workflow_dispatch:

jobs:
  run-tests:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: |
          npm ci
      - name: Run Prettier check
        run: |
          npm run prettier:check
      - name: Run Lint check
        run: |
          npm run lint
      - name: Run Jest tests
        run: |
          npm run test
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: 'microsoft'
          java-version: '21.0.2'
      - name: Setup Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          cmdline-tools-version: 14742923
          packages: tools platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006
      - name: Prebuild
        run: |
          mv android/ android_temp/
          npx expo prebuild --platform android
          \cp -frT android_temp/ android/
      - name: Prepare Android unit test manifests
        run: |
          mkdir -p android/app/src/test android/app/src/testDebug
          cat > android/app/src/test/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32"
                  tools:replace="android:maxSdkVersion" />
          </manifest>
          EOF
          cat > android/app/src/testDebug/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission
                  android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32"
                  tools:replace="android:maxSdkVersion" />
          </manifest>
          EOF
      - name: Run Android unit tests
        run: |
          npm run test:android
